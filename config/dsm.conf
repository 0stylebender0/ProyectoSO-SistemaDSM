[general]
memory_size=104857600
page_size=4096

[network]
bind_address=0.0.0.0
tcp_port=27400
heartbeat_port=0

[discovery]
bootstrap_nodes=
# Participantes disponibles en el cluster (IPv4 o host:puerto, separados por coma).
# Cada direccion se prueba como semilla al incorporarse.
node_addresses=

[heartbeat]
interval_ms=1000
timeout_ms=5000

[network_workers]
worker_count=4
max_connections=64

[paging]
request_timeout_ms=5000

